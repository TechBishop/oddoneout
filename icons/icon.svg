<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="25%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#23123b"/>
      <stop offset="55%" stop-color="#0d1024"/>
      <stop offset="100%" stop-color="#080915"/>
    </radialGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33e6ff"/>
      <stop offset="50%" stop-color="#ff3c91"/>
      <stop offset="100%" stop-color="#ffdc48"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3c91"/>
      <stop offset="100%" stop-color="#33e6ff"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bgGlow)"/>
  <circle cx="256" cy="256" r="188" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="18"/>
  <circle cx="256" cy="256" r="188" fill="none" stroke="url(#ringGrad)" stroke-width="18" stroke-linecap="round" stroke-dasharray="860 1200" transform="rotate(-90 256 256)" filter="url(#neonGlow)"/>
  <!-- Target crosshairs -->
  <line x1="256" y1="42" x2="256" y2="82" stroke="#33e6ff" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="430" x2="256" y2="470" stroke="#ff3c91" stroke-width="10" stroke-linecap="round"/>
  <line x1="42" y1="256" x2="82" y2="256" stroke="#33e6ff" stroke-width="10" stroke-linecap="round"/>
  <line x1="430" y1="256" x2="470" y2="256" stroke="#ff3c91" stroke-width="10" stroke-linecap="round"/>
  <!-- Lightning bolt / ONE SHOT emblem -->
  <path d="M286 112 L168 272 H250 L224 400 L348 236 H264 Z" fill="url(#boltGrad)" filter="url(#neonGlow)"/>
</svg>
